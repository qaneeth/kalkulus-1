// SVG graphics: one coordinate system for curves, lines, and point labels.
class Plot{
 constructor(id,{xmin=-3,xmax=3,ymin=-3,ymax=3,xlabel='x',ylabel='y',square=false}={}){this.id=id;this.b={xmin,xmax,ymin,ymax};this.w=700;this.h=420;this.m={l:58,r:26,t:24,b:45};if(square){const span=(xmax-xmin)*(this.h-this.m.t-this.m.b)/(this.w-this.m.l-this.m.r);const mid=(ymin+ymax)/2;this.b.ymin=mid-span/2;this.b.ymax=mid+span/2;}this.s=[];this.clip='clip-'+id;this.xLabel=xlabel;this.yLabel=ylabel;this.grid();}
 X(x){const b=this.b;return this.m.l+(x-b.xmin)/(b.xmax-b.xmin)*(this.w-this.m.l-this.m.r);}Y(y){const b=this.b;return this.h-this.m.b-(y-b.ymin)/(b.ymax-b.ymin)*(this.h-this.m.t-this.m.b);}
 line(x1,y1,x2,y2,color='#ccd8e3',width=1,dash='',clip=true){this.s.push(`<line x1="${this.X(x1)}" y1="${this.Y(y1)}" x2="${this.X(x2)}" y2="${this.Y(y2)}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''} ${clip?`clip-path="url(#${this.clip})"`:''}/>`);}
 text(x,y,t,color='#586c7c',anchor='middle',dx=0,dy=0){this.s.push(`<text x="${this.X(x)+dx}" y="${this.Y(y)+dy}" fill="${color}" text-anchor="${anchor}">${esc(t)}</text>`);}
 tickStep(span){const raw=span/8,p=10**Math.floor(Math.log10(raw)),a=raw/p;return(a<=1?1:a<=2?2:a<=5?5:10)*p;}
 grid(){const b=this.b;const xs=this.tickStep(b.xmax-b.xmin),ys=this.tickStep(b.ymax-b.ymin);for(let x=Math.ceil(b.xmin/xs)*xs;x<=b.xmax+1e-9;x+=xs){this.line(x,b.ymin,x,b.ymax,'#e7edf4');this.text(x,b.ymin,fmt(x,2),'#718293','middle',0,23);}for(let y=Math.ceil(b.ymin/ys)*ys;y<=b.ymax+1e-9;y+=ys){this.line(b.xmin,y,b.xmax,y,'#e7edf4');this.text(b.xmin,y,fmt(y,2),'#718293','end',-12,5);}if(b.ymin<=0&&b.ymax>=0)this.line(b.xmin,0,b.xmax,0,'#9eafbc',1.2);if(b.xmin<=0&&b.xmax>=0)this.line(0,b.ymin,0,b.ymax,'#9eafbc',1.2);this.text(b.xmax,b.ymin,this.xLabel,'#586c7c','end',0,39);this.text(b.xmin,b.ymax,this.yLabel,'#586c7c','start',-27,-9);}
 path(fn,min=this.b.xmin,max=this.b.xmax,color=C.blue,width=3,dash=''){this.param(t=>[t,fn(t)],min,max,color,width,dash);}
 param(fn,min,max,color=C.blue,width=3,dash=''){let d='',prev=null;const b=this.b;for(let i=0;i<=650;i++){const [x,y]=fn(min+(max-min)*i/650);if(!Number.isFinite(x)||!Number.isFinite(y)||Math.abs(y)>1e5||Math.abs(x)>1e5){prev=null;continue;}const px=this.X(x),py=this.Y(y);if(prev&&Math.abs(py-prev[1])<this.h*1.5&&Math.abs(px-prev[0])<this.w*1.5)d+=`L${px.toFixed(2)},${py.toFixed(2)}`;else d+=`M${px.toFixed(2)},${py.toFixed(2)}`;prev=[px,py];}this.s.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${dash?`stroke-dasharray="${dash}"`:''} clip-path="url(#${this.clip})"/>`);}
 tangent(x,y,m,color=C.teal,dash=''){if(!Number.isFinite(m)){this.line(x,this.b.ymin,x,this.b.ymax,color,2.4,dash);return;}this.line(this.b.xmin,y+m*(this.b.xmin-x),this.b.xmax,y+m*(this.b.xmax-x),color,2.4,dash);}
 dot(x,y,label='',color=C.blue,open=false,offset=[10,-12]){if(!Number.isFinite(x)||!Number.isFinite(y))return;this.s.push(`<circle cx="${this.X(x)}" cy="${this.Y(y)}" r="5.5" fill="${open?'white':color}" stroke="${open?color:'white'}" stroke-width="2.5" clip-path="url(#${this.clip})"/>`);if(label)this.text(x,y,label,color,'start',...offset);}
 render(desc='Grafik fungsi'){const m=this.m;$(this.id).innerHTML=`<svg viewBox="0 0 ${this.w} ${this.h}" role="img" aria-label="${esc(desc)}"><defs><clipPath id="${this.clip}"><rect x="${m.l}" y="${m.t}" width="${this.w-m.l-m.r}" height="${this.h-m.t-m.b}"/></clipPath></defs>${this.s.join('')}</svg>`;}
}
function plotDrag(plot,fn){const svg=$(plot.id).querySelector('svg');let dragging=false;function val(e){const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*plot.w;return plot.b.xmin+(px-plot.m.l)/(plot.w-plot.m.l-plot.m.r)*(plot.b.xmax-plot.b.xmin);}svg.addEventListener('pointerdown',e=>{dragging=true;svg.setPointerCapture(e.pointerId);fn(val(e));});svg.addEventListener('pointermove',e=>{if(dragging)fn(val(e));});svg.addEventListener('pointerup',()=>{dragging=false;});}

function secant(){shell(0,`<div class="lab-grid">${plotPanel('Parabola dan dua garis','secPlot',[['f(x) = 1 − x²',''],['Garis singgung di P','teal'],['Garis potong PQ','orange']],[['Selisih absis h','secH',''],['Kemiringan garis potong','secM',''],['Kemiringan garis singgung','secD','']])}${controlPanel(slider('secA','Absis titik P: a',-1.5,1.5,.1,1)+slider('secExp','Kedekatan Q ke P',0,3,.05,.3)+`<div class="control"><span class="control-label">Arah pendekatan</span><div class="button-row"><button id="secLeft" class="small">Dari kiri</button><button id="secRight" class="small primary">Dari kanan</button></div></div><div class="button-row"><button id="secCloser" class="small">Dekatkan Q</button><button id="secReset" class="small">Contoh diktat</button></div><p class="control-note">Geser pengatur kedekatan ke kanan untuk memperkecil |h|. Nilai h selalu berbeda dari nol.</p>`,formula('Kemiringan garis potong',`m<sub>PQ</sub> = ${frac('f(a + h) − f(a)','h')}`)+formula('Kemiringan garis singgung',`f′(a) = ${lim}${frac('f(a + h) − f(a)','h')}`)+`<div class="math" id="secEq"></div>`)}</div>${observations(['Gunakan a = 1. Bandingkan garis potong dengan garis singgung di P(1, 0).','Dekatkan Q dari kanan. Catat kemiringan garis potong untuk tiga nilai h.','Ulangi pendekatan dari kiri. Apakah kemiringannya menuju nilai yang sama?','Geser a ke 0 dan ke −1. Jelaskan hubungan letak P dengan tanda f′(a).'],`<p>Garis potong melalui dua titik kurva. Garis singgung di P ditentukan oleh limit kemiringan garis potong saat Q mendekati P.</p><div class="callout">Pada proses limit, h mendekati 0. Kita tidak memasukkan h = 0 ke dalam hasil bagi selisih.</div>`,'sec',`<details><summary>Perhitungan pada contoh diktat</summary><div class="math block">${frac('f(1 + h) − f(1)','h')} = ${frac('1 − (1 + h)²','h')} = −2 − h, &nbsp; h ≠ 0.</div><p>Untuk h → 0, kemiringannya menuju −2. Persamaan garis singgung: y = −2x + 2.</p></details>`)}<section class="card" style="margin-top:20px"><h2>Hasil bagi selisih dari kedua arah</h2><div class="table-wrap"><table><thead><tr><th>h</th><th>f(a + h)</th><th>[f(a + h) − f(a)] / h</th></tr></thead><tbody id="secTable"></tbody></table></div><p class="table-note">Tabel diperbarui saat a berubah. Nilai yang ditampilkan dibulatkan.</p></section>`);let sign=1;function draw(){const a=+$('secA').value,exp=+$('secExp').value,h=sign*10**(-exp),f=x=>1-x*x,m=-2*a-h,d=-2*a;setText('secExpOut','|h| = '+fmt(Math.abs(h)));setText('secH',fmt(h));setText('secM',fmt(m));setText('secD',fmt(d));setHTML('secEq',`y − (${fmt(f(a))}) = (${fmt(d)})(x − (${fmt(a)}))`);const p=new Plot('secPlot',{xmin:-2.7,xmax:2.7,ymin:-5,ymax:3});p.path(f);p.tangent(a,f(a),d);p.tangent(a,f(a),m,C.orange,'7 5');p.line(a,f(a),a+h,f(a),C.orange,1.3,'4 4');p.line(a+h,f(a),a+h,f(a+h),C.orange,1.3,'4 4');p.dot(a,f(a),'P',C.teal,false,[-21,-14]);p.dot(a+h,f(a+h),'Q',C.orange,false,[10,19]);p.render(`f(x)=1−x²; P=(${fmt(a)},${fmt(f(a))}), Q=(${fmt(a+h)},${fmt(f(a+h))}); kemiringan potong ${fmt(m)} dan singgung ${fmt(d)}.`);setHTML('secTable',[-1,-.1,-.01,.01,.1,1].map(k=>`<tr><td>${fmt(k)}</td><td>${fmt(f(a+k),5)}</td><td>${fmt(-2*a-k,5)}</td></tr>`).join(''));}bindRange('secA',draw);bindRange('secExp',draw);$('secLeft').onclick=()=>{sign=-1;$('secLeft').classList.add('primary');$('secRight').classList.remove('primary');draw();};$('secRight').onclick=()=>{sign=1;$('secRight').classList.add('primary');$('secLeft').classList.remove('primary');draw();};$('secCloser').onclick=()=>{$('secExp').value=Math.min(3,+$('secExp').value+.5);draw();};$('secReset').onclick=()=>{$('secA').value=1;$('secExp').value=.3;setText('secAOut','1');sign=1;$('secRight').classList.add('primary');$('secLeft').classList.remove('primary');draw();};draw();}
function rate(){shell(1,`<div class="lab-grid">${plotPanel('Grafik posisi terhadap waktu','ratePlot',[['Posisi s(t)',''],['Kecepatan sesaat di t₀','teal'],['Kecepatan rata-rata','orange']],[['Perpindahan Δs','rateDelta','meter'],['Kecepatan rata-rata','rateAvg','m/detik'],['Kecepatan sesaat di t₀','rateNow','m/detik']],true)}${controlPanel(slider('rateA','Waktu awal t₀ (detik)',0,5,.1,2)+slider('rateH','Selang waktu h (detik)',.01,3,.01,3)+`<div class="control"><span class="control-label">Interval pada diktat</span><div class="button-row"><button id="rate03" class="small">[0, 3]</button><button id="rate25" class="small">[2, 5]</button><button id="rateTiny" class="small">h = 0,01</button></div></div>`,formula('Fungsi posisi','s(t) = 1 + 6t − t²')+formula('Kecepatan rata-rata',`v̄ = ${frac('s(t₀ + h) − s(t₀)','h')}`)+formula('Kecepatan sesaat','v(t₀) = s′(t₀) = 6 − 2t₀')+`<p class="control-note">Dalam grafik posisi, kecepatan rata-rata menggunakan perpindahan, yaitu posisi akhir dikurangi posisi awal.</p>`)}</div>${observations(['Pilih interval [0, 3], kemudian [2, 5]. Bandingkan tanda kecepatan rata-ratanya.','Pada t₀ = 2, perkecil h. Ke nilai berapakah kecepatan rata-ratanya mendekat?','Atur t₀ = 3. Apa arti kecepatan sesaat yang bernilai nol?','Gunakan [2, 5]. Apakah jarak tempuh sama dengan besar perpindahan? Perhatikan perubahan arah pada t = 3.'],`<p>Kecepatan bertanda positif jika posisi bertambah, dan negatif jika posisi berkurang. Kelajuan adalah besar kecepatan.</p><div class="callout warn">Kecepatan rata-rata = perpindahan / selang waktu. Kelajuan rata-rata = jarak tempuh / selang waktu. Keduanya dapat berbeda jika partikel berbalik arah.</div>`,'rate',`<details><summary>Perpindahan dan jarak tempuh pada [2, 5]</summary><p>s(2) = 9, s(3) = 10, dan s(5) = 6. Perpindahan = 6 − 9 = −3 meter. Jarak tempuh = |10 − 9| + |6 − 10| = 5 meter.</p><p>Kecepatan rata-rata = −1 m/detik; kelajuan rata-rata = 5/3 m/detik.</p></details>`)}`);function draw(){const a=+$('rateA').value,h=+$('rateH').value,b=a+h,s=t=>1+6*t-t*t,avg=6-2*a-h,v=6-2*a;setText('rateDelta',fmt(s(b)-s(a)));setText('rateAvg',fmt(avg));setText('rateNow',fmt(v));const p=new Plot('ratePlot',{xmin:0,xmax:8.3,ymin:-17,ymax:14,xlabel:'t (detik)',ylabel:'s (m)'});p.path(s,0,8.3);p.tangent(a,s(a),v);p.tangent(a,s(a),avg,C.orange,'7 5');p.dot(a,s(a),'P',C.teal,false,[-21,-14]);p.dot(b,s(b),'Q',C.orange);p.render(`Grafik posisi s(t)=1+6t−t² pada interval ${fmt(a)} sampai ${fmt(b)} detik. Kecepatan rata-rata ${fmt(avg)} m/detik; kecepatan sesaat di awal ${fmt(v)} m/detik.`);const path=a<3&&b>3?Math.abs(s(3)-s(a))+Math.abs(s(b)-s(3)):Math.abs(s(b)-s(a));setText('plotStatus',`Interval [${fmt(a)}, ${fmt(b)}] detik · Jarak tempuh ${fmt(path)} m · Kelajuan rata-rata ${fmt(path/h)} m/detik.`);}bindRange('rateA',draw);bindRange('rateH',draw);function preset(a,h){$('rateA').value=a;$('rateH').value=h;setText('rateAOut',fmt(a));setText('rateHOut',fmt(h));draw();}$('rate03').onclick=()=>preset(0,3);$('rate25').onclick=()=>preset(2,3);$('rateTiny').onclick=()=>preset(+$('rateA').value,.01);draw();}
const functions=[{label:'f(x) = √x',f:x=>x>=0?Math.sqrt(x):NaN,d:x=>x>0?1/(2*Math.sqrt(x)):NaN,eq:'f′(x) = 1/(2√x), x > 0',b:{xmin:0,xmax:10,ymin:-.5,ymax:4},min:.05,max:9.5,a:4},{label:'f(x) = 1 − x²',f:x=>1-x*x,d:x=>-2*x,eq:'f′(x) = −2x',b:{xmin:-3,xmax:3,ymin:-8,ymax:8},min:-2.5,max:2.5,a:1},{label:'f(x) = x³ − 3x',f:x=>x*x*x-3*x,d:x=>3*x*x-3,eq:'f′(x) = 3x² − 3',b:{xmin:-2.3,xmax:2.3,ymin:-5,ymax:10},min:-2,max:2,a:1},{label:'f(x) = 2',f:x=>2,d:x=>0,eq:'f′(x) = 0',b:{xmin:-3,xmax:3,ymin:-2,ymax:4},min:-2.5,max:2.5,a:1}];
function derivative(){shell(2,`<div class="lab-grid">${plotPanel('f dan f′ pada bidang yang sama','derivPlot',[['Fungsi f',''],['Fungsi turunan f′','teal'],['Garis singgung pada f','orange']],[['Absis a','derivAVal',''],['Nilai fungsi f(a)','derivF',''],['Nilai turunan f′(a)','derivD','']],true)}${controlPanel(select('derivFn','Pilih fungsi',functions.map(f=>f.label))+slider('derivA','Absis titik P',.05,9.5,.05,4)+`<div class="control"><label><input id="derivShow" type="checkbox" checked> Tampilkan grafik f′</label><p class="control-note">Sembunyikan f′ terlebih dahulu untuk memperkirakan bentuk grafiknya.</p></div>`,formula('Definisi turunan',`f′(x) = ${lim}${frac('f(x + h) − f(x)','h')}`)+`<div class="math block" id="derivEq"></div><p class="control-note">P = (a, f(a)) berada pada grafik f. R = (a, f′(a)) berada pada grafik f′.</p>`)}</div>${observations(['Pilih f(x) = √x. Bandingkan nilai f(a) dan f′(a) pada a = 1, 4, dan 9.','Pilih f(x) = 1 − x². Di daerah mana f′ bernilai positif, nol, dan negatif?','Pilih f(x) = x³ − 3x. Cari dua titik dengan garis singgung horizontal.','Sembunyikan grafik f′. Perkirakan grafik turunannya, kemudian periksa kembali.'],`<p>Turunan f′ juga merupakan fungsi. Masukannya adalah absis a, sedangkan keluarannya adalah kemiringan garis singgung pada grafik f di absis itu.</p><div class="callout">Nilai f(a) menunjukkan tinggi titik pada grafik. Nilai f′(a) menunjukkan kemiringan garis singgung. Kedua besaran ini mempunyai peran yang berbeda.</div>`,'deriv',`<details><summary>Domain turunan fungsi akar</summary><p>Untuk f(x) = √x, domain f adalah [0, ∞), sedangkan rumus turunan bernilai real berhingga untuk x > 0. Saat x → 0⁺, f′(x) → +∞. Nilai +∞ bukan nilai turunan real di x = 0.</p></details>`)}`);function draw(){const f=functions[+$('derivFn').value],a=+$('derivA').value,d=f.d(a);setText('derivAVal',fmt(a));setText('derivF',fmt(f.f(a)));setText('derivD',fmt(d));setText('derivEq',f.eq);const p=new Plot('derivPlot',f.b);p.path(f.f);if($('derivShow').checked)p.path(f.d,Math.max(f.b.xmin,f.min===.05?.015:f.b.xmin),f.b.xmax,C.teal);p.tangent(a,f.f(a),d,C.orange,'6 4');p.line(a,f.b.ymin,a,f.b.ymax,'#9bafc0',1,'4 5');p.dot(a,f.f(a),'P',C.blue,false,[10,-12]);if($('derivShow').checked)p.dot(a,d,'R',C.teal,false,[10,20]);p.render(`${f.label}. Di a=${fmt(a)}, f(a)=${fmt(f.f(a))} dan f′(a)=${fmt(d)}.`);setText('plotStatus',Math.abs(d)<1e-9?'Garis singgung di P horizontal; f′(a) = 0.':d>0?'Garis singgung di P memiliki kemiringan positif.':'Garis singgung di P memiliki kemiringan negatif.');}bindSelect('derivFn',()=>{const f=functions[+$('derivFn').value];$('derivA').min=f.min;$('derivA').max=f.max;$('derivA').value=f.a;setText('derivAOut',fmt(f.a));draw();});bindRange('derivA',draw);$('derivShow').onchange=draw;draw();}
const diffCases=[{name:'Titik sudut: f(x) = |x|',f:x=>Math.abs(x),left:h=>-1,right:h=>1,b:{xmin:-2,xmax:2,ymin:-.5,ymax:2.5},status:'Kontinu di 0, tetapi tidak dapat diturunkan di 0. Limit kemiringan dari kiri −1, dari kanan 1.',reason:'Limit kiri dan kanan berbeda. Tidak terdapat satu kemiringan garis singgung di titik sudut.',eq:'f′(0) tidak ada; f′(x) = −1 untuk x < 0 dan 1 untuk x > 0.'},{name:'Garis singgung vertikal: f(x) = ∛x',f:x=>Math.cbrt(x),left:h=>h**(-2/3),right:h=>h**(-2/3),b:{xmin:-2,xmax:2,ymin:-2,ymax:2},status:'Kontinu di 0. Kemiringan dari kedua sisi menuju +∞; turunan real berhingga di 0 tidak ada.',reason:'Kurva mempunyai garis singgung vertikal x = 0. Garis vertikal tidak memiliki kemiringan real berhingga.',eq:'f′(x) = 1/(3x²ᐟ³), x ≠ 0. f′(0) tidak ada.'},{name:'Diskontinuitas: nilai f(0) diubah',f:x=>x*x,left:h=>1/h-h,right:h=>h-1/h,b:{xmin:-2,xmax:2,ymin:-2,ymax:4.5},status:'Tidak kontinu di 0 karena lim f(x) = 0, sedangkan f(0) = 1. Maka f tidak dapat diturunkan di 0.',reason:'Hasil bagi selisih dari kiri menuju +∞, sedangkan dari kanan menuju −∞. Perubahan nilai pada satu titik merusak kontinuitas.',eq:'f(x) = x² untuk x ≠ 0; f(0) = 1.'},{name:'Pembanding: f(x) = x²',f:x=>x*x,left:h=>-h,right:h=>h,b:{xmin:-2,xmax:2,ymin:-1,ymax:4.5},status:'Kontinu dan dapat diturunkan di 0. Kedua limit kemiringan sama dengan 0.',reason:'Kemiringan dari kedua sisi menuju 0. Garis singgungnya horizontal, yaitu y = 0.',eq:'f′(x) = 2x; f′(0) = 0.'}];
function differentiability(){shell(3,`<div class="lab-grid">${plotPanel('Pendekatan dari kiri dan kanan','diffPlot',[['Grafik f',''],['Garis potong kiri','orange'],['Garis potong kanan','teal']],[['Jarak ke 0: |h|','diffH',''],['Hasil bagi dari kiri','diffL',''],['Hasil bagi dari kanan','diffR','']],true)}${controlPanel(select('diffFn','Pilih kasus',diffCases.map(f=>f.name))+slider('diffExp','Kedekatan titik ke 0',.1,4,.1,.7)+`<p class="control-note">Titik P tetap pada x = 0. Q₋ dan Q₊ mendekatinya dari sisi yang berbeda. Dua kasus pertama mengikuti ilustrasi pada diktat; dua kasus terakhir dikembangkan sebagai pembanding.</p>`,`<div class="math block" id="diffEq"></div>`+formula('Hasil bagi dari kanan',frac('f(h) − f(0)','h'))+formula('Hasil bagi dari kiri',frac('f(−h) − f(0)','−h'))+`<p class="control-note">Di sini h > 0 menyatakan jarak titik ke 0. Nilai di layar merupakan hasil bagi selisih, belum tentu nilai turunan.</p>`)}</div>${observations(['Gunakan f(x) = |x|. Perkecil |h|. Apakah kedua kemiringan menjadi sama?','Ganti dengan f(x) = ∛x. Apakah hasil bagi selisih mendekati bilangan real tertentu?','Pilih fungsi yang nilai f(0)-nya diubah. Bandingkan f(0) dengan limit f saat x → 0.','Pilih f(x) = x². Bandingkan keempat kasus dan tuliskan syarat keberadaan turunannya.'],`<p id="diffReason"></p><div class="callout">Jika f dapat diturunkan di a, maka f kontinu di a. Fungsi kontinu dapat gagal mempunyai turunan, misalnya pada titik sudut.</div>`,'diff',`<details><summary>Turunan di titik ujung interval</summary><p>Definisi turunan di titik interior memakai limit dua sisi. Pada titik ujung domain, gunakan turunan satu sisi sesuai arah domain. Limit satu sisi tetap harus berhingga agar menghasilkan nilai turunan real.</p></details>`)}`);function draw(){const k=+$('diffFn').value,f=diffCases[k],h=10**(-+$('diffExp').value),p0=k===2?1:0,l=f.left(h),r=f.right(h);setText('diffExpOut','|h| = '+fmt(h,4));setText('diffH',fmt(h,4));setText('diffL',fmt(l));setText('diffR',fmt(r));setText('diffEq',f.eq);setText('diffReason',f.reason);setText('plotStatus',f.status);const p=new Plot('diffPlot',f.b);p.path(f.f,f.b.xmin,k===2?-.00001:f.b.xmax);if(k===2){p.path(f.f,.00001,f.b.xmax);p.dot(0,0,'',C.blue,true);}p.tangent(0,p0,l,C.orange,'7 4');p.tangent(0,p0,r,C.teal,'7 4');p.dot(-h,f.f(-h),'Q₋',C.orange,false,[-35,-13]);p.dot(h,f.f(h),'Q₊',C.teal,false,[10,20]);p.dot(0,p0,'P',C.blue,false,[10,-14]);p.render(`${f.name}. Jarak ${fmt(h,4)}; hasil bagi kiri ${fmt(l)} dan kanan ${fmt(r)}. ${f.status}`);}bindSelect('diffFn',draw);bindRange('diffExp',draw);draw();}
const ruleCases=[{name:'Pangkat dan jumlah',f:x=>5*x**4-3*x*x,d:x=>20*x**3-6*x,eq:'y = 5x⁴ − 3x²',deq:'y′ = 20x³ − 6x',source:'Contoh 4.3.3, hlm. 124',steps:'Turunkan setiap suku: d(5x⁴)/dx = 20x³ dan d(−3x²)/dx = −6x.',b:{xmin:-1.6,xmax:1.6,ymin:-10,ymax:15}},{name:'Hasil kali',f:x=>(3*x*x-2)*(3-2*x**3),d:x=>6*x*(3-2*x**3)+(3*x*x-2)*(-6*x*x),eq:'y = (3x² − 2)(3 − 2x³)',deq:'y′ = 6x(3 − 2x³) − 6x²(3x² − 2)',source:'Contoh 4.3.5, hlm. 125',steps:'Ambil u = 3x² − 2 dan v = 3 − 2x³. Maka u′ = 6x dan v′ = −6x². Gunakan y′ = u′v + uv′.',b:{xmin:-1.6,xmax:1.6,ymin:-15,ymax:15}},{name:'Hasil bagi',f:x=>(3*x*x-x-18)/(3*x+7),d:x=>(9*x*x+42*x+47)/(3*x+7)**2,eq:'y = (3x² − x − 18)/(3x + 7)',deq:'y′ = (9x² + 42x + 47)/(3x + 7)²',source:'Contoh 4.3.6, hlm. 126',steps:'Gunakan y′ = (u′v − uv′)/v² dengan u = 3x² − x − 18 dan v = 3x + 7. Syarat: x ≠ −7/3.',b:{xmin:-1.6,xmax:1.6,ymin:-8,ymax:5}},{name:'Turunan tingkat tinggi',f:x=>3*x**4-3*x**3+7*x*x-2*x+8,d:x=>12*x**3-9*x*x+14*x-2,eq:'f(x) = 3x⁴ − 3x³ + 7x² − 2x + 8',deq:'f′(x) = 12x³ − 9x² + 14x − 2',source:'Contoh 4.3.8, hlm. 127',steps:'f″(x) = 36x² − 18x + 14; f‴(x) = 72x − 18; f⁽⁴⁾(x) = 72; f⁽⁵⁾(x) = 0. Semua turunan berikutnya juga 0.',b:{xmin:-1.6,xmax:1.6,ymin:-20,ymax:45}}];
function rules(){shell(4,`<div class="lab-grid">${plotPanel('Nilai fungsi dan kemiringan','rulePlot',[['Fungsi',''],['Garis singgung','teal']],[['Absis a','ruleAVal',''],['Nilai fungsi','ruleF',''],['Kemiringan','ruleD','']],true)}${controlPanel(select('ruleFn','Aturan yang digunakan',ruleCases.map(f=>f.name))+slider('ruleA','Absis titik singgung',-1.5,1.5,.05,1)+`<div class="control hidden" id="orderControl"><label for="ruleOrder">Orde fungsi pada grafik</label><select id="ruleOrder"><option value="0">f (fungsi semula)</option><option value="1">f′ (turunan pertama)</option><option value="2">f″ (turunan kedua)</option><option value="3">f‴ (turunan ketiga)</option><option value="4">f⁽⁴⁾ (turunan keempat)</option><option value="5">f⁽⁵⁾ (turunan kelima)</option></select></div>`,formula('Fungsi',`<span id="ruleEq"></span>`)+formula('Turunan',`<span id="ruleDEq"></span>`)+`<p class="control-note" id="ruleSteps"></p>`)}</div><section class="card" style="margin-top:20px"><h2>Aturan diferensiasi</h2><div class="table-wrap"><table><thead><tr><th>Bentuk fungsi</th><th>Turunan</th><th>Syarat</th></tr></thead><tbody><tr><td class="math">k</td><td class="math">0</td><td>k konstanta</td></tr><tr><td class="math">xⁿ</td><td class="math">nxⁿ⁻¹</td><td>Di titik tempat rumus terdefinisi; n bilangan bulat pada Subbab 4.3</td></tr><tr><td class="math">ku ± v</td><td class="math">ku′ ± v′</td><td>u dan v dapat diturunkan</td></tr><tr><td class="math">uv</td><td class="math">u′v + uv′</td><td>u dan v dapat diturunkan</td></tr><tr><td class="math">u/v</td><td class="math">(u′v − uv′)/v²</td><td>u dan v dapat diturunkan; v ≠ 0</td></tr></tbody></table></div></section>${observations(['Pilih aturan pangkat dan jumlah. Hitung turunan sebelum melihat hasil pada panel.','Pilih hasil kali. Hitung dengan dua cara: aturan hasil kali dan mengalikan polinomial terlebih dahulu.','Pilih hasil bagi. Tunjukkan asal setiap suku pada pembilang turunannya dan tentukan nilai x yang dilarang.','Pilih turunan tingkat tinggi. Ubah orde grafik hingga turunan kelima. Apa yang terjadi setelah derajat polinomial habis?'],`<p>Aturan diferensiasi mempersingkat perhitungan yang semula dilakukan melalui definisi limit.</p><div class="callout warn">Secara umum, (uv)′ ≠ u′v′ dan (u/v)′ ≠ u′/v′. Susunan suku dalam aturan hasil kali dan hasil bagi perlu diperhatikan.</div>`,'rules')}`);const hFns=[x=>3*x**4-3*x**3+7*x*x-2*x+8,x=>12*x**3-9*x*x+14*x-2,x=>36*x*x-18*x+14,x=>72*x-18,x=>72,x=>0,x=>0];const hEq=['3x⁴ − 3x³ + 7x² − 2x + 8','12x³ − 9x² + 14x − 2','36x² − 18x + 14','72x − 18','72','0','0'];function draw(){const k=+$('ruleFn').value,fn=ruleCases[k],a=+$('ruleA').value,n=k===3?+$('ruleOrder').value:0,f=k===3?hFns[n]:fn.f,d=k===3?hFns[n+1]:fn.d;$('orderControl').classList.toggle('hidden',k!==3);setText('ruleAVal',fmt(a));setText('ruleF',fmt(f(a)));setText('ruleD',fmt(d(a)));setText('ruleEq',k===3?`Orde ${n}: ${hEq[n]}`:fn.eq);setText('ruleDEq',k===3?`Orde ${n+1}: ${hEq[n+1]}`:fn.deq);setText('ruleSteps',fn.steps);setText('plotStatus',fn.source+(k===3?` · Grafik orde ${n}; kemiringannya diberikan oleh turunan orde ${n+1}.`:''));const b={...fn.b};if(k===3&&n===3){b.ymin=-140;b.ymax=110;}if(k===3&&n===4){b.ymin=-10;b.ymax=90;}if(k===3&&n===5){b.ymin=-2;b.ymax=2;}const p=new Plot('rulePlot',b);p.path(f);p.tangent(a,f(a),d(a));p.dot(a,f(a),'P',C.teal);p.render(`Grafik ${k===3?'turunan orde '+n:fn.eq}. Pada a=${fmt(a)}, nilai fungsi ${fmt(f(a))} dan kemiringannya ${fmt(d(a))}.`);}bindRange('ruleA',draw);bindSelect('ruleFn',draw);bindSelect('ruleOrder',draw);draw();}
function chain(){shell(5,`<div class="lab-grid">${plotPanel('Fungsi komposisi dan garis singgung','chainPlot',[['y = (ax + b)ⁿ',''],['Garis singgung','teal']],[['du/dx','chainInner',''],['dy/du di u = ax + b','chainOuter',''],['dy/dx','chainTotal','']],true)}${controlPanel(slider('chainA','Koefisien a',-2,2,.25,2)+slider('chainB','Konstanta b',-2,2,.25,1)+select('chainN','Pangkat n',['n = 2','n = 3','n = 4'])+slider('chainX','Absis titik singgung',-1.5,1.5,.05,.5),formula('Fungsi dalam','u = ax + b')+formula('Fungsi luar','y = uⁿ')+formula('Aturan rantai',`${frac('dy','dx')} = ${frac('dy','du')} · ${frac('du','dx')} = nuⁿ⁻¹ · a`)+`<div class="math block" id="chainEq"></div>`)}</div><div class="observations"><section class="card"><h2>Langkah pengamatan</h2><ol><li>Gunakan a = 2, b = 1, dan n = 2. Hitung du/dx dan dy/du, kemudian kalikan keduanya.</li><li>Ubah a menjadi −1. Selidiki bagaimana tanda kedua faktor memengaruhi dy/dx.</li><li>Atur a = 0. Mengapa fungsi komposisinya menjadi konstan?</li><li>Ubah n. Tuliskan turunan fungsi komposisi tanpa mengembangkan bentuk pangkatnya.</li></ol><div class="callout">Ketika y bergantung pada u dan u bergantung pada x, perubahan y terhadap x harus memperhitungkan kedua hubungan tersebut.</div></section><section class="card"><h2>Contoh pada diktat</h2><p>Contoh 4.4.1: s = 2x² dan x = t² − 2t.</p><div class="math block">${frac('ds','dt')} = 4x(2t − 2)<br>= 4(t² − 2t)(2t − 2).</div><details><summary>Contoh 4.4.2–4.4.3</summary><p>Untuk h(x) = (3x² + 7x − 3)⁻⁶, misalkan u = 3x² + 7x − 3.</p><div class="math block">h′(x) = −6u⁻⁷(6x + 7)<br>= −6(6x + 7)(3x² + 7x − 3)⁻⁷.</div><p>Fungsi dan turunannya terdefinisi jika 3x² + 7x − 3 ≠ 0.</p></details>${quiz('chain')}</section></div><section class="card" style="margin-top:20px"><h2>Laju perubahan dan satuan</h2><p>Ilustrasi pembuka Subbab 4.4: 1 liter bahan bakar digunakan untuk 10 jam kerja mesin, dengan harga Rp5.000 per liter.</p><div class="math block">${frac('dy','dx')} = ${frac('10 jam','1 liter')} · ${frac('1 liter','5 ribu rupiah')} = 2 jam per ribu rupiah.</div><p class="table-note">Grafik di atas merupakan pengembangan untuk y = (ax + b)ⁿ. Contoh dan ilustrasi pada kotak ini mengikuti diktat.</p></section>`);function draw(){const a=+$('chainA').value,b=+$('chainB').value,n=+$('chainN').value+2,x=+$('chainX').value,u=a*x+b,inner=a,outer=n*u**(n-1),total=inner*outer,f=z=>(a*z+b)**n;setText('chainInner',fmt(inner));setText('chainOuter',fmt(outer));setText('chainTotal',fmt(total));setText('chainEq',`y′ = ${n}(${fmt(a)}x + (${fmt(b)}))${['','','','²','³'][n]||''} · (${fmt(a)})`);const vals=[];for(let z=-2;z<=2;z+=.05)vals.push(f(z));const low=Math.min(0,...vals),high=Math.max(1,...vals),pad=(high-low)*.12;const p=new Plot('chainPlot',{xmin:-2,xmax:2,ymin:low-pad,ymax:high+pad});p.path(f);p.tangent(x,f(x),total);p.dot(x,f(x),'P',C.teal);p.render(`Fungsi y=(${a}x+${b}) pangkat ${n}. Pada x=${fmt(x)}, du/dx=${fmt(inner)}, dy/du=${fmt(outer)}, dan dy/dx=${fmt(total)}.`);setText('plotStatus',`Pada x = ${fmt(x)}: u = ${fmt(u)}, y = ${fmt(f(x))}. Hasil kali laju perubahan: (${fmt(outer)}) × (${fmt(inner)}) = ${fmt(total)}.`);}['chainA','chainB','chainX'].forEach(id=>bindRange(id,draw));bindSelect('chainN',draw);draw();}
function implicit(){shell(6,`<div class="lab-grid">${plotPanel('Kurva implisit dan garis singgung','implPlot',[['Kurva implisit',''],['Garis singgung','teal']],[['Absis x','implX',''],['Ordinat y','implY',''],['Kemiringan dy/dx','implD','']],true)}${controlPanel(select('implFn','Pilih kurva',['y² − x + 1 = 0','xy² + x²y = x','x³ + y³ = 3xy'])+`<div id="implSliders"></div><div class="control"><span class="control-label">Titik contoh</span><div class="button-row" id="implPresets"></div></div>`,`<div class="formula-label">Diferensiasi terhadap x</div><div class="math block" id="implSteps"></div><div class="math block" id="implEq"></div><p class="control-note">Saat menurunkan suku yang memuat y, ingat bahwa y bergantung pada x. Misalnya d(y²)/dx = 2y·dy/dx.</p>`)}</div>${observations(['Pilih y² − x + 1 = 0. Bandingkan kemiringan di (2, 1) dan (2, −1).','Geser y ke 0. Perhatikan garis singgung vertikal di titik (1, 0).','Pilih xy² + x²y = x. Mengapa garis x = 0 juga merupakan bagian dari kurva?','Pilih folium Descartes. Periksa garis singgung di (3/2, 3/2), kemudian cari titik dengan garis singgung horizontal.'],`<p>Persamaan implisit dapat memuat beberapa cabang kurva. Nilai turunan ditentukan pada cabang dan titik yang sedang ditinjau.</p><div class="callout warn">Jika pembilang dan penyebut rumus dy/dx sama-sama nol, rumus itu belum menentukan kemiringan. Bentuk kurva di sekitar titik harus diperiksa.</div>`,'implicit',`<details><summary>Folium Descartes: Contoh 4.4.6</summary><div class="math block">3x² + 3y²y′ = 3y + 3xy′<br>(y² − x)y′ = y − x²<br>y′ = ${frac('y − x²','y² − x')}, &nbsp; y² − x ≠ 0.</div><p>Di (3/2, 3/2), kemiringannya −1 dan persamaan garis singgungnya y = 3 − x.</p><p>Selain cabang yang bertangen horizontal di (0, 0), titik singgung horizontal pada lengkungnya adalah (2¹ᐟ³, 2²ᐟ³). Di asal terdapat pula cabang bertangen vertikal, sehingga rumus 0/0 tidak memberi satu kemiringan tunggal.</p></details>`)}`);function setup(){const k=+$('implFn').value;setHTML('implSliders',k===0?slider('implParam','Ordinat y',-2.3,2.3,.05,1):k===1?slider('implParam','Absis x pada cabang lengkung',-2.5,2.5,.05,1)+select('implBranch','Cabang lengkung',['Cabang atas','Cabang bawah']):slider('implParam','Parameter t pada folium',0,3,.01,1));setHTML('implPresets',k===0?'<button class="small" data-preset="1">(2, 1)</button><button class="small" data-preset="-1">(2, −1)</button><button class="small" data-preset="0">Puncak</button>':k===1?'<button class="small" data-preset="1">x = 1</button><button class="small" data-preset="0">x = 0</button>':'<button class="small" data-preset="1">(3/2, 3/2)</button><button class="small" id="implHorizontal">Singgung horizontal</button><button class="small" data-preset="0">Titik asal</button>');bindRange('implParam',()=>{exactT=null;draw();});if(k===1)bindSelect('implBranch',draw);document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{exactT=null;$('implParam').value=b.dataset.preset;setText('implParamOut',fmt(+b.dataset.preset));draw();});if($('implHorizontal'))$('implHorizontal').onclick=()=>{exactT=Math.cbrt(2);$('implParam').value=exactT;setText('implParamOut',fmt(exactT));draw();};exactT=null;draw();}let exactT=null;function draw(){const k=+$('implFn').value,t=exactT??+$('implParam').value;let x,y,m,status,steps,eq,p;if(k===0){y=t;x=y*y+1;m=Math.abs(y)<1e-9?Infinity:1/(2*y);p=new Plot('implPlot',{xmin:-.6,xmax:7,ymin:-3,ymax:3});p.param(v=>[v*v+1,v],-3,3);steps='2y·y′ − 1 = 0';eq='y′ = 1/(2y), y ≠ 0';status=Math.abs(y)<1e-9?'Di (1, 0), garis singgungnya x = 1. dy/dx tidak memiliki nilai real berhingga.':`Garis singgung di (${fmt(x)}, ${fmt(y)}): y − (${fmt(y)}) = (${fmt(m)})(x − (${fmt(x)})).`;}else if(k===1){x=t;const s=+$('implBranch').value===0?1:-1;const branch=(z,q)=>(-z+q*Math.sqrt(z*z+4))/2;y=branch(x,s);m=(-1+s*x/Math.sqrt(x*x+4))/2;p=new Plot('implPlot',{xmin:-3,xmax:3,ymin:-3,ymax:3});p.path(z=>branch(z,1));p.path(z=>branch(z,-1));p.line(0,-3,0,3,C.blue,3);steps='y² + 2xy·y′ + 2xy + x²y′ = 1';eq='y′ = (1 − y² − 2xy)/(2xy + x²)';status=`Pada cabang yang dipilih, kemiringan ${fmt(m)}. Garis x = 0 juga termasuk kurva.`;if(Math.abs(x)<1e-9){status='Di x = 0 dan y = ±1, pembilang dan penyebut sama-sama 0. Cabang lengkung bertangen dengan kemiringan −1/2 dan berpotongan dengan garis vertikal x = 0.';p.line(0,-3,0,3,C.teal,2.4,'5 4');}}else{x=3*t/(1+t**3);y=3*t*t/(1+t**3);const den=y*y-x,num=y-x*x;m=Math.abs(den)<1e-9?Infinity:num/den;p=new Plot('implPlot',{xmin:-3.3,xmax:3.3,ymin:-2,ymax:4.5,square:true});const param=v=>[3*v/(1+v**3),3*v*v/(1+v**3)];p.param(param,-12,-1.015);p.param(param,-.985,12);p.param(param,12,180);steps='3x² + 3y²y′ = 3y + 3xy′';eq='y′ = (y − x²)/(y² − x)';if(Math.abs(t)<1e-9){m=NaN;status='Titik asal adalah titik singular. Dua cabang mempunyai garis singgung y = 0 dan x = 0; rumus dy/dx berbentuk 0/0.';p.line(p.b.xmin,0,p.b.xmax,0,C.teal,2.4);p.line(0,p.b.ymin,0,p.b.ymax,C.teal,2.4,'5 4');}else status=!Number.isFinite(m)?'Garis singgung vertikal; dy/dx tidak bernilai real berhingga.':`Pada titik ini, dy/dx = ${fmt(m)}. ${Math.abs(m)<1e-8?'Garis singgung horizontal.':Math.abs(t-1)<1e-8?'Persamaan garis singgung: y = 3 − x.':''}`;}if(!(k===2&&t===0))p.tangent(x,y,m);p.dot(x,y,'P',C.teal);p.render(`Kurva ${['y²−x+1=0','xy²+x²y=x','x³+y³=3xy'][k]} di P=(${fmt(x)},${fmt(y)}). ${status}`);setText('implX',fmt(x));setText('implY',fmt(y));setText('implD',k===2&&t===0?'singular':k===1&&Math.abs(x)<1e-9?'dua arah':Number.isFinite(m)?fmt(m):'vertikal');setText('implSteps',steps);setText('implEq',eq);setText('plotStatus',status);}bindSelect('implFn',setup);setup();}
const prompts=[
['Garis potong dan garis singgung','Untuk f(x) = 1 − x² di a = 1, catat tiga kemiringan dari kiri dan tiga dari kanan. Tentukan limitnya dan persamaan garis singgung.'],
['Kecepatan dan kelajuan','Untuk s(t) = 1 + 6t − t² pada [2, 5], hitung perpindahan, jarak tempuh, kecepatan rata-rata, dan kelajuan rata-rata. Jelaskan perbedaannya.'],
['Fungsi dan turunannya','Untuk f(x) = √x, catat f(a) dan f′(a) pada a = 1, 4, 9. Jelaskan apa yang terjadi pada kemiringan ketika a membesar.'],
['Keberadaan turunan','Bandingkan |x|, ∛x, dan x² di x = 0. Mana yang kontinu? Mana yang mempunyai turunan real berhingga? Berikan alasan berdasarkan limit hasil bagi selisih.'],
['Aturan diferensiasi','Turunkan (3x² − 2)(3 − 2x³) dengan dua cara. Kemudian tentukan turunan kedua dari 3x⁴ − 3x³ + 7x² − 2x + 8.'],
['Aturan rantai','Tentukan turunan (3x² + 7x − 3)⁻⁶. Tuliskan fungsi dalam, fungsi luar, dan syarat domainnya.'],
['Diferensiasi implisit','Tentukan garis singgung y² − x + 1 = 0 di (2, −1). Jelaskan pula keadaan garis singgung di (1, 0).'],
['Folium Descartes','Untuk x³ + y³ = 3xy, tentukan garis singgung di (3/2, 3/2). Jelaskan mengapa hasil 0/0 pada rumus turunan di (0, 0) perlu ditinjau kembali.']
];
function updateScore(){const ids=Object.keys(quizzes),done=ids.filter(k=>Number.isInteger(state.answers[k])).length,good=ids.filter(k=>state.answers[k]===quizzes[k].a).length;setText('quizScore',`${good} dari ${ids.length} jawaban benar · ${done} soal sudah dijawab. Jawaban dapat diperbaiki setelah membaca penjelasan.`);}
function worksheet(){shell(7,`<div class="intro-strip"><b>8 kegiatan pengamatan</b><span>·</span><span>9 soal pemeriksaan</span></div><section class="card"><h2>Identitas</h2><div class="identity-fields"><label>Nama<input id="studentName" autocomplete="name" value="${esc(state.name)}" placeholder="Nama lengkap"></label><label>NRP<input id="studentID" value="${esc(state.student)}" placeholder="Nomor mahasiswa"></label><label>Kelas<input id="studentClass" value="${esc(state.className)}" placeholder="Kelas"></label></div><p class="saved" id="saveStatus">${storageOK?'Catatan tersimpan otomatis pada peramban ini.':'Penyimpanan otomatis tidak tersedia. Unduh catatan sebelum menutup halaman.'} Catatan tidak dikirim secara otomatis kepada dosen.</p></section><div class="divider-label">Hasil pengamatan</div><div class="worksheet-grid">${prompts.map(([t,p],i)=>`<section class="card"><h2>${t}</h2><p id="prompt${i}">${p}</p><label class="sr-only" for="note${i}">Jawaban: ${t}</label><textarea id="note${i}" data-note="${i}" aria-describedby="prompt${i}" placeholder="Tuliskan hasil pengamatan dan perhitungan.">${esc(state.notes[i]||'')}</textarea><div class="print-answer" id="printNote${i}">${esc(state.notes[i]||'')}</div></section>`).join('')}</div><div class="worksheet-actions"><button class="primary" id="exportNotes">Unduh catatan (.txt)</button><button id="printNotes">Cetak lembar kerja</button></div><div class="divider-label">Latihan pemeriksaan</div><div class="quiz-score" id="quizScore" role="status"></div><div class="worksheet-grid">${Object.keys(quizzes).map(k=>`<section class="card">${quiz(k)}</section>`).join('')}</div><section class="card" style="margin-top:20px"><h2>Rujukan kegiatan</h2><div class="table-wrap"><table><thead><tr><th>Kegiatan</th><th>Rujukan pada diktat</th></tr></thead><tbody><tr><td>Garis singgung</td><td>Contoh 4.1.1–4.1.2, hlm. 110</td></tr><tr><td>Laju perubahan</td><td>Contoh 4.1.3–4.1.5, hlm. 111–112</td></tr><tr><td>Fungsi turunan</td><td>Definisi 4.2.1, Contoh 4.2.1, hlm. 114–115</td></tr><tr><td>Keberadaan turunan</td><td>Definisi 4.2.2, Teorema 4.2.1, Contoh 4.2.2, hlm. 115–119</td></tr><tr><td>Diferensiasi</td><td>Teorema 4.3.1–4.3.6, Contoh 4.3.3–4.3.8, hlm. 122–127</td></tr><tr><td>Aturan rantai</td><td>Teorema 4.4.1, Contoh 4.4.1–4.4.3, hlm. 129–131</td></tr><tr><td>Diferensiasi implisit</td><td>Contoh 4.4.4–4.4.6, hlm. 132–134</td></tr></tbody></table></div><p class="table-note">Grafik dinamis, variasi parameter, dan soal pemeriksaan disusun untuk laboratorium ini. Nomor contoh merujuk pada diktat; pertanyaan pengamatan tidak dinyatakan sebagai soal asli diktat.</p></section>`);[['studentName','name'],['studentID','student'],['studentClass','className']].forEach(([id,k])=>$(id).oninput=()=>{state[k]=$(id).value;save();});document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{state.notes[t.dataset.note]=t.value;setText('printNote'+t.dataset.note,t.value);save();if(!storageOK)setText('saveStatus','Penyimpanan otomatis tidak tersedia. Unduh catatan sebelum menutup halaman.');});$('exportNotes').onclick=exportNotes;$('printNotes').onclick=()=>window.print();updateScore();}
function exportNotes(){let text=`LABORATORIUM KALKULUS 1\nBAB 4: DERIVATIF\n\nNama: ${state.name}\nNRP: ${state.student}\nKelas: ${state.className}\n\n`;prompts.forEach(([t,p],i)=>{text+=`${i+1}. ${t.toUpperCase()}\n${p}\n\n${state.notes[i]||'(belum diisi)'}\n\n`;});text+='LATIHAN PEMERIKSAAN\n';Object.entries(quizzes).forEach(([k,q],i)=>{const a=state.answers[k];text+=`${i+1}. ${q.q}\nJawaban: ${Number.isInteger(a)?q.o[a]:'(belum dijawab)'}\nHasil: ${Number.isInteger(a)?a===q.a?'benar':'belum benar':'belum dijawab'}\n\n`;});text+='Acuan: Diktat Kuliah Kalkulus 1, Departemen Matematika FSAD ITS, Juli 2023, Bab 4, hlm. 109–136.\n';download(text,'Catatan_Laboratorium_Kalkulus_1_Bab_4.txt');toast('Catatan telah diunduh.');}
function go(i){if(i<0||i>7)return;state.page=i;if(!state.visited.includes(i))state.visited.push(i);save();$('navigation').innerHTML=modules.map((m,j)=>`<button class="nav-button ${j===i?'active':''} ${state.visited.includes(j)?'visited':''}" data-page="${j}" ${j===i?'aria-current="page"':''}><span class="nav-number">${j+1}</span><span>${m[1]}</span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page));setText('progressText',`${state.visited.length} dari 8 bagian dibuka`);$('progressBar').style.width=(state.visited.length/8*100)+'%';$('sidebar').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false');[secant,rate,derivative,differentiability,rules,chain,implicit,worksheet][i]();history.replaceState(null,'','#bagian-'+(i+1));window.scrollTo({top:0,behavior:'instant'});}
$('menuBtn').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open));};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('sidebar').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false');}});
$('printBtn').onclick=()=>window.print();$('downloadBtn').onclick=()=>{const copy=document.documentElement.cloneNode(true);copy.querySelector('#main').innerHTML='';copy.querySelector('#navigation').innerHTML='';copy.querySelectorAll('input:not([type=range])').forEach(t=>{if(t.type!=='checkbox')t.setAttribute('value','');});download('<!doctype html>\n'+copy.outerHTML,'Laboratorium_Kalkulus_1_Bab_4.html','text/html;charset=utf-8');toast('HTML diunduh. Buka berkas dengan peramban.');};
$('guideBtn').onclick=()=>{const i=state.page;$('main').innerHTML=`<div class="eyebrow">Petunjuk penggunaan</div><h1>Laboratorium Bab 4</h1><div class="card guide"><h2>Urutan kegiatan</h2><p>Ikuti bagian 1 sampai 7 untuk meninjau konsep dan melakukan percobaan. Setiap bagian memuat grafik, pengatur parameter, langkah pengamatan, dan satu soal pemeriksaan. Catat hasilnya pada bagian 8.</p><h3>Menggunakan grafik</h3><p>Ubah nilai melalui penggeser dan daftar pilihan. Nilai pada panel hasil akan diperbarui. Baca label sumbu dan legenda sebelum membandingkan grafik. Skala sumbu dapat berbeda untuk setiap percobaan; kemiringan dibaca dari nilai matematis, bukan semata-mata dari besar sudut pada layar.</p><h3>Menjawab latihan</h3><p>Pilih satu jawaban. Penjelasan muncul setelah jawaban dipilih. Jawaban dapat diperbaiki. Latihan ini digunakan untuk pemeriksaan pemahaman secara mandiri.</p><h3>Menyimpan hasil</h3><p>Catatan dan jawaban tersimpan pada peramban yang sama jika penyimpanan lokal tersedia. Gunakan “Unduh catatan (.txt)” pada lembar kerja untuk menyimpan salinan atau mengumpulkannya. Berkas HTML dapat digunakan tanpa koneksi internet setelah diunduh.</p><h3>Untuk pembahasan di kelas</h3><p>Bagian 1–4 membahas makna dan keberadaan turunan. Bagian 5–7 membahas teknik perhitungan. Dosen dapat memilih kegiatan sesuai alokasi waktu. Semua jawaban pemeriksaan dapat dilihat pada halaman, sehingga latihan ini tidak dimaksudkan sebagai ujian tertutup.</p><h3>Rujukan</h3><p><i>Diktat Kuliah Kalkulus 1</i>, Tim Dosen Departemen Matematika FSAD ITS, Juli 2023, Bab 4: Derivatif, hlm. 109–136. Rujukan halaman yang lebih khusus dituliskan pada setiap percobaan.</p><button class="primary" id="backToLab">Kembali ke percobaan</button></div>`;$('backToLab').onclick=()=>go(i);window.scrollTo(0,0);};
const initial=Number(location.hash.replace('#bagian-',''))-1;go(Number.isInteger(initial)&&initial>=0&&initial<8?initial:0);
